#
# Cut back on 2026-09-21, second pass. The first paragraph was an education record written as prose -- direct
# track, department, school, B.Sc., B.A., M.Sc., 2026 -- which is exactly the online-CV register he rejected
# ("not make it an online cv but more hey this is me website"), and cv.pdf already carries every one of those
# facts. Do not put the degree list back, and do not let any paragraph restate identity_line.
#
# The practicum clause in the third paragraph -- "a headphone add-on for the noises that set anxiety off" --
# was re-read on 2026-09-21 against the owner's programme-first ruling (see the note over `projects`) and
# KEPT unchanged. It survives that ruling on its own terms: it is a passing mention in a list of two things
# he built with other people, it names no personal contribution, no sensor and no business step, and it is in
# his voice, which he asked for. Naming the programme here instead would make the third paragraph of an
# "about me" carry a programme's name for no reader's benefit -- the Research page says all that, once.
# The rule the ruling sets for this paragraph is narrow and should be kept: do not add to this clause.
#
# Fourth pass, 2026-09-25 (deep review, WP-S1); the third pass of 2026-09-23 had only stopped the opening from
# repeating the role line. The order is now: the argument, in plain words, closing on the paper at NeurIPS
# 2025; then who -- the field, the advisor, the start and the expected end; then what else. The first
# paragraph used to open on the advisor and a pointer to the CV, and the first "NeurIPS" a reader met stood
# 1352px down the page at 1280x800; the argument leads now, its number carries its chance baseline (one in
# twenty), and the paragraph ends on the venue, expanded, so it is the first use on the page. The old
# "a mapping flexible enough to fit anything" overstated the paper: the mechanism is that the fitted mapping
# reshapes the network's features, which is what is said. The CV pointer went because the CV chip is in the
# strip on every page. The field words every CV prints -- "NeuroAI and computational cognitive neuroscience",
# FACTS ID-FIELD -- enter the site here, in the second paragraph: do not turn this back into "I am a PhD
