# THE PRACTICUM ENTRY. The owner ruled on this twice on 2026-09-21, and the SECOND ruling is the one in force.
#
# RULING IN FORCE (source O, 2026-09-21), his words verbatim: "i think its need to be more of a description of
# an neurotechnology internship practicum for grad students collaborate with brown university at providence
# blah blah, like more about the environment less on what i did, if they want to know they can ask. (also on
# the website btw i think)". Shown the options, he chose "Joint BGU-Brown neurotech practicum for grad
# students" and "One entry, programme-first": keep the entry where it is, on the site and on the CVs, but let
# the PROGRAMME lead, name EarBetter in a clause, and say nothing about who did what.
# So the entry is titled by the programme and the blurb describes it; EarBetter is the second sentence. The
# same reframe is in the CV repository, shared/projects.tex, with the same ruling recorded beside it.
#
# THREE THINGS WERE DELETED AT HIS REQUEST AND MUST NOT COME BACK, here or in the news entry or in About:
#   * the personal-contribution clause -- "I wrote the control software and put the system together";
#   * the sensor inventory -- Muse headband, heart-rate variability, skin conductance (it was never on the
#     site, but it was on the CVs, and it must not migrate here);
#   * the go-to-market and business-plan detail -- "did the go-to-market work, wrote a business plan" -- of
#     which the single word "pitched" is all that survives.
# Do not replace them with different personal-contribution wording: he asked for less about what he did, not
# for it said another way. "if they want to know they can ask" is the whole point of the entry's brevity.
#
# SUPERSEDED, kept as evidence of what was printed and why. Until this ruling the entry was titled "EarBetter"
# and read: "Our five-person team's product from the Embodied Brain Technology Practicum at Brown University:
# an add-on that works with any headphones, reads your biosignals, processes on your phone, and filters out
# the sounds that set a person's anxiety off. We built a working version, did the go-to-market work, wrote a
# business plan and pitched it. I wrote the control software and put the system together." That itself
# replaced an earlier paper-language framing ("It explores whether physiological signals can drive selective
# audio attenuation ... has not been clinically evaluated"), on his account of 2026-09-21: "the idea of the
# course is internship and we didn't explore, we came out with an idea of having a product that works with
# any headphones that record biosignals and selectively reduce certain noises ... then we implemented a
# version of it and we also did the all go-to-market stuff and built a business plan and pitched it", and
# "it's an add-on that will process through your phone and get biosignals and stuff" -- so the team did not
# build headphones, and the add-on wording below is still his. Neither superseded form is to be restored.
#
# FACTS THE ENTRY MAY STATE, all established: the practicum is the Embodied Brain Technology Practicum, run
# jointly by Ben-Gurion University and Brown University; it ran at Brown, in Providence, USA, from 24 July to
# 6 August 2026; entry was competitive; his team of five designed, built and pitched EarBetter. "Two weeks" is
# derived from the dates in `period`, not asserted. NOT stated, because no source gives them: a course code,
# the size of the Brown cohort, and any award. The number of BGU participants he was one of is NOT printed
# either -- it is on his own list of private numbers (the CV register records that ruling), and the entry says
# the entry was competitive and stops.
projects:
# Titled by the programme, not by the product: under a heading a reader's eye reaches first, "EarBetter" would
