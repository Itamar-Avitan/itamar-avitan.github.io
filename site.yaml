research:
- title: 'Model–Behavior Alignment under Flexible Evaluation: When the Best-Fitting Model Isn’t the Right One'
  authors:
  - Itamar Avitan
  - Tal Golan
  me: Itamar Avitan
  # For the ScholarlyArticle record in the research page's head only (FACTS PUB-CITATION and PUB-DOI); neither
  # prints on the card. The DOI is the identifier Google Scholar and Semantic Scholar reconcile on, the
  # academic CVs print it, and the BibTeX block below carries the same one (build.py refuses a disagreement).
  published: {periodical: Advances in Neural Information Processing Systems, volume: '38', year: '2025'}
  doi: 10.52202/085713-0404
  # THE CARD AS AN ARGUMENT (controller decision C4 under owner ruling 18, 2026-09-25, built by WP-S18; the
  # shape is external review 3 §23's table). Five run-in blocks -- Question, Setup, Test, Result, Scope -- in
  # place of the Summary, the "How the test works" heading and the "What we found" paragraph of WP-S3: the
  # diagram strip stands under Test and illustrates Setup and Test (its captions are `how`, below), and what
  # was found is Result. Every clause was checked against arXiv 2510.23321v2 (abstract, §1-3, §4 with its
  # Limitations) on 2026-09-26 before it was printed; the register's rows are FACTS RES-DESC, RES-PLATEAU
  # and PUB-NUM (W: the same abstract).
  #   question  the abstract's "does the test accuracy of such predictions identify genuine representational
  #             alignment?" and §1's "does predictive accuracy correctly recover the data-generating model?";
  #             "linear probing" is the paper's term for the fitted linear mapping (§2.1), "fits it best" its
  #             title's best-fitting model.
  #   setup     §2.2: "a set of 20 ANNs of diverse architectures and training tasks", each "aligned ... to the
  #             THINGS odd-one-out training dataset (4.5 million triplets)"; the calibration is §2.1's, the
  #             temperature adjusted "to ensure that the variability of simulated responses matches that of
  #             human judgments". The space in "4.5 million" is a no-break space (U+00A0): the number stood
  #             at a line's end and its unit opened the next at every width from 1030 to 1440 in Chromium,
  #             and at 380 and 670-710 (WebKit: 400 and 710) -- the laptop view most readers get (review of
  #             WP-S18, 2026-09-26).
  #   test      the abstract: "For each model in turn, we sampled synthetic responses from its probabilistic
  #             predictions, fitted all candidate models to the synthetic data"; §2.2: "all 20 models ... were
  #             independently fitted to the synthetic training data from scratch", and "prediction accuracy
  #             was evaluated on the test triplets" -- the held-out judgments.
  #   result    the abstract: "Model recovery accuracy improved with training-set size but plateaued below 80%,
  #             even at millions of simulated trials" (§3.2: "even with 4.2 million training triplets, it did
  #             not reach 80%"); the chance baseline is §2.2's chance level 1/|M|, one in twenty for 20 models;
  #             "Regression analyses linked misidentification primarily to shifts in representational geometry
  #             induced by the linear transformation" (the abstract; "mainly" is its "primarily" and rests on
  #             that word alone: two of §3.3's three significant predictors are shift magnitudes, the
  #             candidate's, β = 0.495, and the generator's, β = -0.251; the third, the generator's
  #             post-alignment effective dimensionality, β = -0.455, is not the smaller of them, and the
  #             abstract names it "as well"). The number is printed once on
  #             this card, here; "simulated" keeps the millions apart from the human judgments of Setup.
  #   scope     the sentence of decision C4, checked clause by clause. The task: Limitations, "limited to
  #             behavioral data, and specifically, to the THINGS odd-one-out task". The model set: "the
  #             quantitative model recovery accuracy levels reported are specific to the candidate model set
  #             used". The noise calibration: the noise-calibrated simulation of §2.1-2.2. The linear
  #             transformation family: the p x p linear probing of §3.2, which §3.4 varies from zero-shot to
  #             full. "Not a claim that every flexible evaluation fails": the abstract's own hedge, "overly
  #             flexible alignment metrics may fail", and Limitations, "the severity of this trade-off for
  #             neural data cannot be inferred from our findings". "Predict well and still be unreliable for
  #             identification": §3.1 (several models near the noise ceiling, none significantly better) with
  #             §3.2, and §3.4's trade-off. "Needs a recovery test": the Discussion, "the pursuit of predictive
  #             performance must be tempered ... through noise-calibrated model recovery simulations".
  #             "Flexible evaluation" is the paper's own term (its title), as the home page's block says it;
  #             C4's draft had "flexible comparison". The paper's "more fundamental limitation" -- recovery
  #             within a closed set is "a necessary but insufficient criterion", because the true model, "the
  #             biological representations", is absent from the candidate set -- stood here as a third
  #             sentence and moved into the second open question, which now names the brain: measured with
  #             it, the page was 3626px at 1280 against its 3600px ceiling (tests/test_browser.py), and prose
  #             is tightened before anything else.
  #   "12" appears nowhere (a private number, see the note over `projects`). "held-out" is in `nobreak`.
  #   Measured after the tightening (Chromium, 2026-09-26): see the FINISH note in the review's progress file;
  #   the ceiling test records the heights.
  argument:
    question: 'When a comparison fits a flexible linear mapping from each model’s features to behavioral data (linear probing), can it still identify the model that generated the data, or only the one that fits it best?'
    setup: 'We fitted 20 vision models of diverse architectures and training tasks to 4.5 million human odd-one-out judgments from the THINGS dataset, and calibrated each so that its simulated answers vary as much as people’s do.'
    test: 'Each fitted model in turn generates synthetic judgments; all 20 are refitted to those from scratch and compared on held-out judgments.'
    result: 'Recovery improved as the simulated experiment grew, then leveled off below 80%: far above the one in twenty of guessing, but wrong more than one time in five, even with millions of simulated trials. Regression analyses linked the misidentifications mainly to how much the fitted linear mapping reshapes a model’s representational geometry.'
    scope: 'This holds for the task, model set, noise calibration and linear transformation family we evaluated; it is not a claim that every flexible evaluation fails. It means a comparison can predict well and still be unreliable for identification, so the comparison itself needs a recovery test.'
  # The strip's captions, the open questions and the citation (deep review 2026-09-25, WP-S3; the diagram is
  # the owner's ruling 3).
  #   how    the four stages of the model-recovery test, in the order of his diagram (known generating model ->
  #          simulated judgments -> fitted candidates -> the wrong winner); the abstract: "For each model in
  #          turn, we sampled synthetic responses ... fitted all candidate models ... re-emerge as the best
  #          predictor". Each stage is printed as the caption of one mark of the diagram, with a visible
  #          counter 1-4, so the captions are the diagram's labels in the page's own font: the marks
  #          themselves hold no text and no numeral (templates/macros.html.j2, recovery_mark). Since
  #          2026-09-26 (WP-S18) the strip stands under the Test block, which states the procedure in one
  #          sentence; the captions are stage names -- a short phrase each, no full stop, as the home page's
  #          one-word captions are -- and not sentences, because as sentences they said the procedure a
  #          second time straight after Test, about 900px of scroll on a phone saying one thing twice, the
  #          fault PLAN WP-S3 had removed once before (review of WP-S18, 2026-09-26). The first names the
  #          generator among the 20 (the mark's one filled square), the fourth what the ranking is asked --
  #          whether the generator is on top -- under a mark that draws it second, ruling 3's wrong winner.
  #          "models", as the argument says it, never "networks" here (the home page's block keeps its
  #          word). A test holds the captions to eight words and no full stop.
  #   open   questions the paper itself raises; each comment names its section of arXiv 2510.23321. Not a
  #          statement of current work, and not framed as his directions: the owner ruled on 2026-09-25 that
  #          they stay the paper's own, under the run-in "Questions the paper leaves open" (ruling 16, WP-S11;
  #          record kept privately). The last two words of the second and third are tied with a no-break
  #          space (U+00A0): `.open li` is not a <p>, so the page's `p { text-wrap: pretty }` does not reach
  #          it, and "set?" (at 390) and "people?" (at 1280 and 1440) stood alone on their last line in
  #          Chromium, Firefox and WebKit (deep review, WP-S3 second review). The words do not change, and
  #          the tests split on whitespace, so they read the items as before.
  #   cite   the BibTeX entry, behind a "Cite (BibTeX)" expander. Every field is FACTS PUB-CITATION plus the
  #          DOI of PUB-DOI; no `pages`, because the two published paginations disagree.
  how:
  - One of the 20 as the generator
  - Its simulated judgments
  - All 20 refitted to them
  - 'The ranking: is the generator on top?'
  open:
  - How much freedom should an evaluation give the mapping, given what we want the comparison to identify?   # §3.4 and Discussion, the accuracy–identifiability trade-off
  - How should a recovery test be built when the true system — in a real experiment, a brain — is outside the candidate set?   # Discussion, Limitations: recovery within a closed set is "a necessary but insufficient criterion"; the true model, "the biological representations", is absent from the candidate set
  - How should a comparison treat the variability of responses within and between people?   # Introduction; Discussion, "Change the metrics"
  cite: |-
    @inproceedings{avitan2025modelbehavior,
      title     = {Model--Behavior Alignment under Flexible Evaluation: When the Best-Fitting Model Isn't the Right One},
      author    = {Avitan, Itamar and Golan, Tal},
      booktitle = {Advances in Neural Information Processing Systems},
      volume    = {38},
      year      = {2025},
      doi       = {10.52202/085713-0404}
    }
  # The front door's version of this card (WP-S17, 2026-09-26: astra's wireframe, controller decision C1
  # under owner ruling 18; record kept privately). The home page draws the block from here -- the first venue
  # badge, the title's second half, these four sentences, the four marks of the diagram with these captions,
  # and the Paper, Code and video buttons -- so nothing about the paper is written twice.
  #   question  the paper's question in one sentence, in the words of its own title.
  #   test      what was done, in one sentence: the abstract's 20 models, 4.5 million judgments, each model
  #             generating judgments in turn, and the comparison asked to pick it out.
  #   result    the number with its chance baseline, in the wording verified for the site on 2026-09-25
  #             (WP-S1): one in twenty is the paper's 1/|M| with |M| = 20 models; "simulated" keeps the
  #             millions of trials apart from the human judgments named a sentence earlier.
  #   scope     the result's reach, as the research page states it (controller decision C4): the evaluated
  #             task, model set, noise calibration and transformation family, and not a claim about every
  #             flexible evaluation -- the paper's own term for the mapping. "Noise calibration" in full, as
  #             the research page says it: bare "calibration" had no referent on this page (review of WP-S17).
  #   stages    one-word captions for the four marks (`how` above has the card's own short phrases): the
  #             generator, its judgments, the candidates all fitted to them, the ranking -- whose winner the
  #             fourth mark draws as the wrong one. The last caption is "ranking", not "winner": under a
  #             drawing of the wrong winner, "winner" alone read as if the generator had won (review of
  #             WP-S17, 2026-09-26; for the owner's eye). The marks are aria-hidden, so these four words are
  #             all a screen reader hears of the strip; the sentences above it say the rest.
  # 90 words in the four sentences (the block's budget is 40-90; the test holds the line at 90). No numeral in the captions; "12" nowhere
  # (a private number, see the note over `projects`). The tie in "one in twenty" is not needed: the
  # paragraph is a <p>, so `text-wrap: pretty` looks after its last line.
  feature:
    question: Is the network that predicts human judgments best also the right one?
    test: We fitted 20 networks to 4.5 million human odd-one-out judgments, let each generate judgments, and asked whether the comparison would pick it out.
    result: 'It picked the right one less than 80% of the time: far above the one in twenty of guessing, but wrong more than one time in five, even with millions of simulated trials.'
    scope: That is a result for the task, models, noise calibration and mappings we tested, not a claim that every flexible evaluation fails.
    stages: [generator, judgments, candidates, ranking]
  # The citation's venue line, under the authors, as academic cards carry it: FACTS PUB-CITATION's compact
  # wording. The badge above stays "NeurIPS 2025", a venue tag; the track belongs here, not in the badge, where
  # a " · " would turn it into a neutral presentation tag (PR-08). No rank and no acceptance rate (ruling).
  venue: Advances in Neural Information Processing Systems 38 (NeurIPS 2025), main track
  badges:
  - NeurIPS 2025
  - CCN 2025 · Talk
