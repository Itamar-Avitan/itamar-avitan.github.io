research:
- title: 'Model–Behavior Alignment under Flexible Evaluation: When the Best-Fitting Model Isn’t the Right One'
  authors:
  - Itamar Avitan
  - Tal Golan
  me: Itamar Avitan
  # For the ScholarlyArticle record in the research page's head only (FACTS PUB-CITATION and PUB-DOI); neither
  # prints on the card. The DOI is the identifier Google Scholar and Semantic Scholar reconcile on, the
  # academic CVs print it, and the BibTeX block below carries the same one (build.py refuses a disagreement).
  published: {periodical: Advances in Neural Information Processing Systems, volume: '38', year: '2025'}
  doi: 10.52202/085713-0404
  # Every clause is the arXiv 2510.23321 abstract (the W source of FACTS RES-DESC, RES-PLATEAU and PUB-NUM):
  # the method, named by the paper's own term "linear probing", and the number with its chance baseline, one
  # in twenty being the paper's 1/|M| with |M| = 20 models. The mechanism, the abstract's regression sentence,
  # is said once, in `found` below (deep review 2026-09-25, WP-S3), not here as well. "millions of simulated
  # trials" is the abstract's phrase: without "simulated", the millions read as the human data named a few
  # words earlier (CS-07 with PR-01's calibration clause).
  tldr: To test whether a vision model represents images the way people do, researchers often fit a flexible linear mapping from the model’s features to human judgments (linear probing) and compare how well each model predicts. We fitted 20 vision models to 4.5 million odd-one-out judgments from the THINGS dataset, calibrated each to human response variability, let each one in turn generate simulated judgments, and asked whether the comparison would pick out the model that had generated them. It did so less than 80% of the time, even with millions of simulated trials — far above chance (one in twenty), but wrong more than one time in five.
  # The depth blocks under the Summary (deep review 2026-09-25, WP-S3; the diagram is the owner's ruling 3).
  #   how    the four stages of the model-recovery test, in the order of his diagram (known generating model ->
  #          simulated judgments -> fitted candidates -> the wrong winner); every clause is the abstract: "For
  #          each model in turn, we sampled synthetic responses ... fitted all candidate models ... re-emerge
  #          as the best predictor". Each step is printed as the caption of one mark of the diagram, with a
  #          visible counter 1-4, so the captions are the diagram's labels in the page's own font: the marks
  #          themselves hold no text and no numeral (templates/macros.html.j2, recovery_mark).
  #   found  the plateau, the geometry-shift mechanism (the abstract's regression sentence, moved here from
  #          the Summary), the accuracy-identifiability trade-off, and the paper's own closed-set caveat.
  #   open   questions the paper itself raises; each comment names its section of arXiv 2510.23321. Not a
  #          statement of current work (that is Q-H, the owner's). The last two words of the second and third
  #          are tied with a no-break space (U+00A0): `.open li` is not a <p>, so the page's `p { text-wrap:
  #          pretty }` does not reach it, and "set?" (at 390) and "people?" (at 1280 and 1440) stood alone on
  #          their last line in Chromium, Firefox and WebKit (deep review, WP-S3 second review). The words do
  #          not change, and the tests split on whitespace, so they read the items as before.
  #   cite   the BibTeX entry, behind a "Cite (BibTeX)" expander. Every field is FACTS PUB-CITATION plus the
  #          DOI of PUB-DOI; no `pages`, because the two published paginations disagree.
  how:
  - Each of the 20 networks, already fitted to the human judgments, takes a turn as the generator.
  - It answers millions of odd-one-out questions as if it were a participant.
  - All 20 networks are fitted to those simulated answers, the way they would be fitted to people’s.
  - The comparison ranks them. One that can be trusted puts the generator on top.
  found: 'Not reliably, and not for lack of data: recovery improved as the simulated experiment grew, then leveled off. Regression analyses linked the misidentifications mainly to how much the fitted linear mapping reshapes a network’s representational geometry. The flexibility that buys predictive accuracy costs the ability to tell the models apart. And recovering the right model from a closed set is only a necessary condition: in a real experiment the system that made the data — a brain — is not one of the candidates.'
  open:
  - How much freedom should an evaluation give the mapping, given what we want the comparison to identify?   # §3.4 and Discussion, the accuracy–identifiability trade-off
  - How should a recovery test be built when the true system is outside the candidate set?   # Discussion, Limitations
  - How should a comparison treat the variability of responses within and between people?   # Introduction; Discussion, "Change the metrics"
