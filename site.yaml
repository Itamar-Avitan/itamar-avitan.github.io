  # 2026-09-25 by the deep review's course-research pass and read again 2026-09-26 (WP-S20).
  - title: Deep Learning for Neuroscience and Cognition
    kind: Teaching assistant
    when: spring 2026
    what: 'A theoretical and hands-on introduction to the main branches of modern deep learning, from convolutional networks to transformers and generative models, and their applications in neuroscience and cognition.'
  # The semester is the catalogue's: its lecturer search, run on his name by the deep review's course-research
