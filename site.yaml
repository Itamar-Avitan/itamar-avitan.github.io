# Lines about the mind, collected. text, attribution and note are printed; year is the gutter label; status,
# evidence and copyright are the provenance record and are not rendered. Always name a quotation's source.
# House rule: keep a quotation from a work that is still in copyright to a single sentence. The Snape entry
# below is a deliberate exception, ruled by the owner and recorded there; every future in-copyright entry
# still starts from the single sentence.
# The quotation marks belong to the text here, not to a CSS rule, so that a reader who copies a line gets the
# marks with it. The year is a plain date like every other label in the gutter: a date that needs a
# parenthetical belongs in the attribution, where there is room to say it properly.
# ORDER: the owner's, chosen on 2026-09-21 -- "the snape quote needs to be first". The list used to run
# oldest first, so that the years in the gutter only went forward; that rule is dropped, because he cares
# which line a reader meets first and the gutter can carry 2003 above 1887. A commonplace book is a person's
# own order, not a chronology. Keep his order when you add to it: say where a new line goes, do not sort.
quotes_intro: Lines about memory and mind I keep coming back to.
quotes:
# The owner was shown that this novel is in copyright and that the single sentence “The mind is not a book…”
# was the safer extract, and chose the full four-sentence passage anyway on 2026-09-21. It is printed here at
# his instruction: do not silently shorten it back. The verifier’s two corrections are applied — “mind
# reading” as two words, and the last sentence carried through to “most minds are” instead of breaking off
# after “Potter—”.
- text: “Only Muggles talk of ‘mind reading.’ The mind is not a book, to be opened at will and examined at leisure. Thoughts are not etched on the inside of skulls, to be perused by any invader. The mind is a complex and many-layered thing, Potter—or at least, most minds are.”
  attribution: Severus Snape, in J.K. Rowling, Harry Potter and the Order of the Phoenix (2003), Chapter 24, “Occlumency”
  year: '2003'
  status: corrected
  evidence: >-
    The novel is in copyright and no full text is reachable, so wording was triangulated across scanned books
    via Open Library full-text search (openlibrary.org/search/inside). Six-plus independent works reproduce the
    passage identically, including Trevarthen, The Seeker’s Guide to Harry Potter (“Snape responds, “Only
    Muggles talk of ‘mind reading.’ The mind is not a book, to be opened at will and examined at leisure.
    Thoughts are not etched on the inside of skulls, to be perused by any invader. The mind is a complex and
    many-layered thing, Potter—or at least, most minds are.”), Baggett & Klein, Harry Potter and Philosophy,
    Iacoboni, Mirroring People, and Lorrie Kim, Snape: A Definitive Reading. Speaker independently confirmed as
    Severus Snape by Wikiquote’s Order of the Phoenix page. Chapter confirmed by two reference works citing it
    directly: Waters, Ultimate Unofficial Guide to the Mysteries of Harry Potter (“that pun in the title of
    Chapter 24 — ‘Occlumency’”) and Boughey, Unauthorized Harry Potter and the Art of Spying (“Chapter 24,
    ‘Occlumency,’ understandably focuses on what Muggles…”). Recommended extract was one sentence — the
    shortest faithful unit that carries the thought — because the work is in copyright; the owner read that
    recommendation and ruled on 2026-09-21 for the full four-sentence passage, which is what is printed.
    Two corrections were applied to his wording: “mind reading” is two words in every source consulted, and
    the closing sentence runs on to “or at least, most minds are” rather than breaking off after “Potter—”.
  copyright: in-copyright-extended-extract-owner-ruled
  # The note used to end “after Harry calls Legilimency “mind reading”” — which the first sentence of the
  # longer extract now says itself, two lines above it. It points back at those words instead of repeating them.
  note: Snape’s retort in Harry’s first Occlumency lesson, after Harry gives Legilimency that name.
- text: “I consider that a man’s brain originally is like a little empty attic, and you have to stock it with such furniture as you choose.”
  attribution: Sherlock Holmes, in Arthur Conan Doyle, A Study in Scarlet (1887), Part I, Chapter II, “The Science of Deduction”
  year: '1887'
  status: verified
  evidence: >-
    Project Gutenberg ebook #244 (https://www.gutenberg.org/cache/epub/244/pg244.txt), downloaded in full and
    grepped. Passage at lines 493-495, which falls between the CHAPTER II heading (line 407, title “THE SCIENCE
    OF DEDUCTION”) and CHAPTER III (line 787), inside PART I (line 69) — so Part I, Chapter II is correct.
    Extracted character-for-character; note the apostrophe in “man’s” is a curly U+2019. In the novel the
    sentence opens ‘“You see,” he explained, “I consider that a man’s brain…”’, so starting the quote at “I
    consider” is a faithful extract. The owner’s “skilful workman” gloss is also confirmed verbatim at lines
    499-501: “Now the skilful workman is very careful indeed as to what he takes into his brain-attic. He will
    have nothing but the tools which may help him in doing his work…” (British single-l “skilful”).
  copyright: public-domain
  note: Holmes says this immediately after learning the earth goes round the sun and replying, “Now that I do know it I shall do my best to forget it.”
- text: “The proper study of mankind is man.”
  attribution: Dr. John Watson, in Arthur Conan Doyle, A Study in Scarlet (1887), Part I, Chapter I, “Mr. Sherlock Holmes” — quoting Alexander Pope, An Essay on Man, Epistle II (1733–34)
  year: '1887'
  status: verified
  evidence: >-
    Project Gutenberg ebook #244, lines 393-395. Exact source text: ‘“Oh! a mystery is it?” I cried, rubbing my
    hands. “This is very piquant. I am much obliged to you for bringing us together. ‘The proper study of
    mankind is man,’ you know.”’ The line sits between CHAPTER I (line 78, title “MR. SHERLOCK HOLMES”) and
    CHAPTER II (line 407), confirming Part I, Chapter I. Speaker is the first-person narrator Watson,
    addressing Stamford. Pope verified independently in two public-domain editions: Gutenberg ebook #2428 (An
    Essay on Man; Moral Essays and Satires), Epistle II lines 1-2 — “Know, then, thyself, presume not God to
    scan; / The proper study of mankind is man.” — and the Wikisource transcription of the 1751 edition
    (en.wikisource.org/wiki/An_Essay_on_Man/Chapter_4), which reads identically apart from period spelling
    (“Plac’d on this isthmus”).
  copyright: public-domain
  note: Doyle prints it in single quotation marks because Watson is himself quoting Pope; Stamford’s reply is “You must study him, then… You’ll find him a knotty problem.”
- text: “There is a strong family resemblance about misdeeds, and if you have all the details of a thousand at your finger ends, it is odd if you can’t unravel the thousand and first.”
  attribution: Sherlock Holmes, in Arthur Conan Doyle, A Study in Scarlet (1887), Part I, Chapter II, “The Science of Deduction”
  year: '1887'
  status: verified
  evidence: >-
    Project Gutenberg ebook #244 (https://www.gutenberg.org/cache/epub/244/pg244.txt), downloaded in full
    (268,777 bytes) and grepped. “family resemblance” occurs exactly once in the book. The sentence spans
    lines 669-671 (byte offset 31491), which falls between the CHAPTER II heading (line 407, offset 17066,
    title “THE SCIENCE OF DEDUCTION”) and CHAPTER III (line 787, offset 36946), and inside PART I (line 69,
    offset 1581; PART II does not begin until offset 121861) — so Part I, Chapter II is correct, and the
    chapter title is confirmed both at the heading itself and in the book’s own CONTENTS list (“CHAPTER II.
    THE SCIENCE OF DEDUCTION.”). Extracted character for character and diffed in Python against the owner’s
    wording: the sole difference is the apostrophe in “can’t”, a curly U+2019 in the source, which is what is
    printed above. Speaker confirmed as Holmes from the surrounding dialogue: Doyle narrates ‘“You would lose
    your money,” Sherlock Holmes remarked calmly. “As for the article, I wrote it myself.”’ and the quoted
    sentence sits inside the same unbroken Holmes speech that begins “Well, I have a trade of my own. I
    suppose I am the only one in the world. I’m a consulting detective…” (line 663). Watson is not speaking
    here. Publication year 1887 is stated on the Gutenberg catalogue page for the work
    (https://www.gutenberg.org/ebooks/244) and matches the two A Study in Scarlet entries above. The
    enclosing curly quotation marks are this file’s house convention, not part of the source sentence.
  copyright: public-domain
  note: From the speech in which Holmes first explains his trade — “I suppose I am the only one in the world. I’m a consulting detective” — moments after admitting to Watson that he himself wrote the magazine article on deduction Watson had just ridiculed.
# Teaching, in two sections since 2026-09-21. It was one undifferentiated list of four sentences: no headings,
# no ticks of its own, the only page on the site with no internal structure -- and it ranked "mentoring two
# undergraduate research students" level with a three-year teaching assistantship. Worse, this page is meant
# to be the authority on his teaching and it did not carry the academic writing course that "about" and "now"
# above both announce for 2026/27. The institution is not repeated on every row any more: the page's own intro
# says it once, and the one row that belongs to another unit names it (Dean of Students Office).
#   title  the course, or the students.
#   kind   what he is in it: an outlined tag in the gutter, under the dates -- the same label a talk carries.
#   when   the years. Lifted into the gutter and ticked on the margin rule like every other date on the site.
#   what   DRAFT. One sentence on what the course is about, written from the course's own name and from what
#          this site already says; the rows carry no claim about his duties beyond the role in "kind", because
#          nothing here records them. What he actually does inside each course is his to say -- when he says
#          it, replace these sentences with his words rather than adding to them.
# The academic writing course's own title is not recorded anywhere yet; "Academic writing" stands in for it,
# and it is the one entry on this page whose name still has to be confirmed.
teaching:
  courses:
  - title: Introduction to Cognition and Computation
    kind: Teaching assistant
    when: 2023/24, 2024/25 and 2025/26
    what: 'An introduction to treating a mind as something that computes: the questions cognitive science asks, and the models built to answer them.'
  # Quote the year. `when` is lifted into the gutter and split on the en dash by the template, so a bare 2024
  # is read by YAML as an integer and the build stops on it. This is the first row whose date is a bare year.
  # It is placed here, not last, because the gutter dates are a time axis and 2024 precedes spring 2026.
  - title: Computational Approaches to Neuroimaging
    kind: Teaching assistant
    when: '2024'
    what: 'Turning brain images into numbers: the computational methods that take imaging data and make a measurement out of it.'
  - title: Deep Learning for Neuroscience and Cognition
    kind: Teaching assistant
    when: spring 2026
    what: 'Deep networks as models of brains and behaviour: how one is built and trained, and what it takes to read it as a claim about a mind.'
  # "Joining", not "Teaching assistant": what "now" and "about" record is that he joins this course in
  # 2026/27, not in what capacity. The tag says exactly that and no more until he says the rest.
  - title: Academic writing
    kind: Joining
    when: from 2026/27
    what: 'Writing up a result: what a paper has to say, and how to say it so that a reader can check it.'
  students:
  - title: Two undergraduate research students
    kind: Mentoring
    when: 2025–2026
  # The subjects are TEACH-TUTOR's, from the advisor-edited CV the register sources: the site printed a
  # weaker list that dropped statistics and said "algebra" where the confirmed subject is linear algebra.
  - title: Calculus, linear algebra and statistics, Dean of Students Office
    kind: Tutor
    when: 2021–2023

# The accessibility statement. Every line below is a claim about this site, so the rule for editing it is
# stricter than for anything else in this file: it may only say what is true and what is checked.
#   * Each bullet under `done` names something a test actually asserts (tests/test_build.py,
#     tests/test_browser.py) or a plain fact of the build. If you change the site so that one of them stops
#     being true, change the bullet in the same commit -- a stale accessibility statement is worse than none.
#   * `aim` says what the site AIMS at. Do not turn it into a conformance claim: nothing here has been
#     audited, and an untested claim of conformance is the one thing such a page must never make.
#   * `limits` is not an apology, it is the other half of the statement. Keep it.
#   * NO LEGAL CLAIM OF ANY KIND. No law is cited here and none should be: this is a personal site, the
#     question of which rules bind it is not one this page can answer, and saying otherwise would be a claim
#     about his obligations that nobody has checked.
#   * The address is NOT repeated here. `report` points at the colophon, which carries it on every page,
#     written as "name [at] host" and turned into a link in the browser. Two reasons, both load-bearing: the
#     build refuses a plain address anywhere in this file, and exactly one element per page may carry
#     id="email" -- that is the hook the script in base.html.j2 uses.
accessibility:
  aim: 'This site aims at WCAG 2.1 Level AA — the Web Content Accessibility Guidelines, level AA. That is the standard I hold it to. It is not a certificate: nobody but me has audited this site, and the list below is what was actually done, not a claim that the whole of AA has been met.'
  done_intro: 'What that has meant in practice. Each of these is checked automatically before the site is built, so it stays true:'
  done:
  - 'Nothing loads from anyone else. The fonts are served from this site, and no page asks any other host for anything — no analytics, no trackers, no embedded players, no hosted fonts — so the pages work on a slow or filtered connection, and reading them tells nobody else that you were here.'
  - 'Contrast is measured, not judged by eye. Every piece of text painted on every page is sampled in a real browser and checked against the WCAG contrast formula — 4.5 to 1 for ordinary text, 3 to 1 for large text — in the light theme and in the dark one, and in each of them reached both from your system setting and from the theme button.'
  - 'Everything you can use, you can reach from a keyboard, and you can see where you are: every link and the theme button draws the same two-pixel ring when it takes focus.'
  - 'The controls are big enough to hit: every link in the navigation strip, in the row of profiles and in the footer is at least 24 by 24 pixels to point at, at every width down to a 320-pixel screen. A link set inside a sentence is left at the size of the words around it.'
  - 'Nothing moves on its own. The only motion is a short colour fade and smooth scrolling, and both are switched off for a visitor whose system asks for reduced motion.'
  - 'The markup says what things are: one first-level heading per page, headings that never skip a level, lists marked up as lists, the navigation in a named landmark with the current page marked, and a language set on the document.'
  - 'Every image carries a description of what it shows, written for a reader who cannot see it.'
  - 'The site works with JavaScript switched off: the pages are ordinary links. Two things need it, and both fail quietly — the theme button, which stays hidden until the script has run rather than sitting there doing nothing, and my e-mail address, which is written as text and made into a link in your browser so that it is harder to harvest.'
  - 'Body text is set at 16 pixels or larger, the layout reflows into one column on a phone, and no page scrolls sideways at any width down to 320 pixels.'
  limits_intro: 'The gaps I know about, so that the list above is not read for more than it says:'
  limits:
  - This site has not been audited by anyone else, and it has not been tested with a screen reader, with voice control or with a magnifier. The checks above are automated ones and my own reading, and neither can tell you how a page actually sounds.
  - 'The CV is a PDF, and it is the weakest thing here: it is built so that its text comes out in order and every address in it is real text, but it is not a tagged PDF.'
  - This is a personal site. I write it and keep it working, in the time I have, so a fix may not be quick.
  report: 'If something here is hard to use, or does not work with whatever you use to read the web, please tell me — that is the fastest way for it to get fixed. My address is on every page of this site: at the top of the home page, and at the foot of the others. What helps most: which page you were on, what you were using, and what happened.'

