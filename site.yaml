  nav: Home
- slug: research/
  nav: Research
  heading: Research
  intro: Neural networks can predict human visual judgments, such as which of three images is the odd one out. I ask when that accuracy means a network represents the world as people do. A flexible mapping from model features to human data can make the wrong model look right, so I use model-recovery simulations to test whether a comparison recovers the model that generated the data. Our results argue for experiments that balance predictive accuracy against identifiability.
  description: The paper, talks and projects of Itamar Avitan, on identifying the right model of human vision rather than the best-fitting one.
- slug: teaching/
  nav: Teaching
  heading: Teaching
  intro: Courses I help teach at Ben-Gurion University of the Negev, and the students I work with.
  description: Courses Itamar Avitan teaches at Ben-Gurion University of the Negev, and the students he mentors.
- slug: commonplace/
  nav: Commonplace
  heading: Commonplace
  description: 'A commonplace book: lines about memory and mind that Itamar Avitan keeps coming back to.'

