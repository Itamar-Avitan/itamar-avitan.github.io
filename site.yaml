# icon: which mark the template draws before the label. The template now holds three, and only three:
# mail, github, bluesky. The owner ruled on 2026-09-21 that LinkedIn, ORCID, Google Scholar and X carry no
# mark, for reasons of policy and legibility that are not open to revision; templates/macros.html.j2 records
# each one beside the marks it still draws. Do not add an icon key to those four: the build has nothing to
# draw for them, and tests/test_build.py fails if the set changes.
# The links that carry a mark are listed before the ones that cannot, so the marks are contiguous and do not
# read as four icons that failed to load. They are two lists in the markup and one even row on the page: the
