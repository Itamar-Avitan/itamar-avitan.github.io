- best-fitting
- Ground-Truth
- Linear Probing
- Neuro-AI-Talks
- (NEAT) 2026
- (NeurIPS) 2025
- (CCN) 2025
- odd-one-out
- five-person
- add-on
- brain–computer
- 1733–34
# "Negev, Israel" (the role line) is NOT here: the label ties it with a no-break space instead, because WebKit lets
# a nowrap span that holds a space run past the column by up to a space width (see the note over `role`).

# Titles of works that are set in italic wherever they occur in the text, the way a book-length work or a long
# poem is set in running prose (Chicago 8.171, MLA, APA), while a chapter title keeps its quotation marks. The
# template wraps each in <i class="work"> after the no-break wrapping (macros.html.j2, nb()); the italic face is
# fonts/fira-sans-latin-400-italic.woff2, self-hosted like the other four, so the page still asks no other host
# for anything (deep review 2026-09-25, DS-07). Not <cite>: the attributions are paragraphs that open with a
# speaker, and a test forbids <cite> on that page. A title here must occur in the content exactly as written,
# spaces included -- "An Essay on Man" is tied with no-break spaces in the Pope attribution, so it is tied here
# too -- and tests/test_build.py fails on an entry that matches nothing, as it does for `nobreak`.
works:
- Harry Potter and the Order of the Phoenix
- A Study in Scarlet
- An Essay on Man

