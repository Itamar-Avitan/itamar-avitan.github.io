# so the line never ends on "Writing." by itself -- the last pair is kept whole, as "wrong winner" is in the
# figure's caption. The template prints one line as a paragraph and two or more as the dotted list, so the
# block can grow back into a list without a template change.
# The research line that stood here from 2026-09-25 ("Carrying the NeurIPS 2025 work forward: ...") went with
# the wireframe: it repeated the paper's question under a heading meant for what he is doing this term. What
# it kept out still holds -- the NEAT 2026 flash talk stands on this site as title, co-authors, place and date
# only, and no line here describes that work (owner ruling 16, WP-S11; record kept privately).
# Owner ruling 2026-09-25: the site says nothing about what he is looking for; the résumés carry the
