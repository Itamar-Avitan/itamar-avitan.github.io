about:
- I am a PhD candidate in the Brains and Machines Lab at Ben-Gurion University of the Negev, on the direct track, advised by Dr. Tal Golan. My department is Industrial Engineering and Management, and I am affiliated with the School of Brain Sciences and Cognition. I came here through a B.Sc. in Cognitive and Brain Sciences (computational track) and a B.A. in Psychology, and finished my M.Sc. inside the direct track in 2026.
- What I keep coming back to is a measurement question. When we say that a neural network sees the way people do, can our measures tell us that it is the right model, or only that it is the best-fitting one? It has taken me to NeurIPS 2025, a talk at CCN 2025, and this September to Osnabrück.
- 'I teach as well: courses on cognition and computation and on deep learning, an academic writing course from next year, and two undergraduate students whose research I mentor. I like building things with other people — an EEG speller that let a person with ALS answer yes or no, and a headphone add-on for the noises that set anxiety off. And I collect lines about the mind.'
# DRAFT, as above. Short enough to keep true: rewrite it whenever it stops being what you are doing.
