  # (review of WP-S19): only where the tied unit never breaks inside a word at 200% text on a 320-390px phone.
  # The same test rules out "and cognition." below (split at 320px) and "imaging (fMRI)" (split at 320px);
  # "in Python." at the end of the neuroimaging sentence holds, and is tied (WP-S20).
  - title: Introduction to Computation and Cognition
    kind: Teaching assistant
    when: 2023/24, 2024/25, 2025/26 and 2026/27
    what: 'Basic approaches in computational neuroscience and machine learning: artificial neural networks for supervised, unsupervised and reinforcement learning, and Bayesian models of perception and decision-making, with Python assignments.'
  # The sentence follows the catalogue's summary (theoretical and practical familiarity with the branches of
  # deep learning as a contemporary engineering tool, with example applications in neuroscience and cognition)
  # and takes its three named branches from the syllabus for spring 2026, the semester he lists: convolutional
