#
# PROGRAMME-FIRST: the entry describes the practicum -- a neurotechnology programme for graduate students,
# run with Brown University in Providence -- rather than what he did in it (owner ruling, 2026-09-21; record
# kept privately). Shown the options, he chose "Joint BGU-Brown neurotech practicum for grad students" and
# "One entry, programme-first": keep the entry where it is, on the site and on the CVs, but let the PROGRAMME
# lead, name EarBetter in a clause, and -- until rulings 4 and 7 below -- say nothing about who did what.
# So the entry is titled by the programme and the blurb describes it; EarBetter is the second sentence and
# his one clause closes it. The same shape is in the CV repository, shared/projects.tex, with the same rulings
# recorded beside it.
#
# RULINGS (source O; FACTS PROJ-EBT-DESC, in the CV repository, has the record). 2026-09-21, programme-first:
# the programme leads, EarBetter is a clause; the sensor inventory (Muse headband, heart-rate variability, skin
# conductance) and the go-to-market / business-plan detail were deleted at his request and stay deleted --
# 'pitched' is all that survives of the pitch. 2026-09-25, rulings 4 and 7: one short clause on his own part is
# allowed again, in the ruled wording, 'I led the system integration' (owner ruling 7, 2026-09-25; record kept
# privately). Do not grow it into a list of what he did; do not restore the sensors or the business plan; do
# not put it in News or About. 2026-09-25, ruling 15 (built 2026-09-26, WP-S13): EarBetter is described by
# what it was designed to do, never as a working filter -- on this row "an add-on for any headphones,
# designed to read biosignals and filter out the sounds that set a person’s anxiety off", and in About on
# the home page "a headphone add-on designed to filter the sounds that set anxiety off" (WP-S17) --
# superseding, for this clause alone, the ruling of 2026-09-21 that the entry say the system worked. The
# README the Code link opens calls the selective path experimental and says anxiety inference was not
# evaluated or claimed, so the printed claim and the evidence it links agree. The Aug 2026 news item, a screen
# under About, names EarBetter and links this row rather than describe it a second time (review of WP-S17,
# 2026-09-26; until then it carried the ruled clause word for word). The comma after "headphones" is the site's own (the
# plan's site wording has none; the CVs' long form has it): without it, "headphones designed to read
# biosignals" reads as the headphones' design, not the add-on's. (The wordings retired by these rulings are
# not kept here, and neither are the owner's own messages: a sentence retired from the page but kept word for
# word in a public repository is not off the site. The history lives in FACTS PROJ-EBT-DESC and the private
# ledgers; deep review 2026-09-25, external review 2 §16.)
#
# FACTS THE ENTRY MAY STATE, all established: the practicum is the Embodied Brain Technology Practicum, run
# jointly by Ben-Gurion University and Brown University; it ran at Brown, in Providence, USA, from 24 July to
# 6 August 2026; entry was competitive; his team of five designed, built and pitched EarBetter, an add-on for
# any headphones, designed to read biosignals and filter out anxiety-triggering sounds (its purpose, not a
# result: ruling 15); he led the system integration (ruling 7). "Two weeks" is derived from the dates in
# `period`, not asserted. NOT stated, because no source gives them: a course code, the size of the Brown
# cohort, and any award. One number attached to this entry is private and is NOT printed either (owner
# ruling, 2026-09-21; the CV register records it), and the entry says the entry was competitive and stops.
