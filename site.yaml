# (About, here, the Teaching invitation); it stands now as the fourth year on the course row under `teaching`
# and behind the invitation's label, and the wireframe's "or" (the TA-again fact or Academic Writing) took
# the writing course as the current activity. Two no-break spaces: one ties "From" to its year, because at
