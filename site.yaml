# oldest first, so that the years in the gutter only went forward; that rule is dropped, because he cares
# which line a reader meets first and the gutter can carry 2003 above 1887. A commonplace book is a person's
# own order, not a chronology. Keep his order when you add to it: say where a new line goes, do not sort.
# The intro says what a commonplace book is, for the reader who has not met the word, and what these four
# have in common -- "about minds, and about how to study one" covers Pope's line and the thousand-and-first
# misdeed as well as the two the old intro fit (deep review 2026-09-25, CS-18 and DI-05). "how to study one"
# is the agent's phrase for what the lines share, not his: Q-N item 18 asks whether he wants his own sentence
