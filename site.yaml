- title: BCI4ALS
  period: 2022–2023
  blurb: In a team of five, we built a brain–computer interface (BCI) that let a person with amyotrophic lateral sclerosis (ALS) answer yes/no questions through the P300 brain response measured with electroencephalography (EEG). The person it was built for used it live. I worked on the data collection, the signal processing and the real-time system.
# Lines about the mind, collected, and read as a reading room (external review 3 §24; controller decision C2
# under owner ruling 18, 2026-09-25; record kept privately): the line first, then its source, then one note of
# context. Printed keys: text; the source line, which the template composes from speaker, author, work, year
# and chapter (and, for a line that itself quotes another work, `quoting`, with the same author/work/year/
# chapter); note; and source_url, which makes the work's title a link to a free text of the work where one
# exists. slug is the entry's own address on the page (see PERMALINKS below). status, evidence and copyright
# are the provenance record and are not rendered. Always name a quotation's source: build.py refuses an entry
# without speaker, author, work and year, and refuses the old one-string `attribution`, so the fields are the
# only place a source is written and the design can tell the speaker from the work.
# SOURCE LINKS: the three Doyle lines link A Study in Scarlet to Project Gutenberg ebook #244, the text their
# evidence was checked against; the Rowling novel is in copyright and has no free text, so its title is not a
# link. A source_url is always https, and tools/check_links.py asks for it with every other address.
# PERMALINKS (deep review 2026-09-25, AS-52): every quotation carries a `slug` -- lower-case ASCII words
# joined by hyphens -- which becomes the id of its entry and the address of the small "§" link at the end of
# its source line, so that one line can be shared (commonplace/#holmes-brain-attic lands on that entry, on a
# panel of the page's accent tint). A slug is NEVER CHANGED once published: a link someone kept would stop
# landing. build.py refuses a quotation without one, a malformed one, and two the same. The link is always
# painted, never only on hover: a keyboard or a finger cannot hover.
# House rule: keep a quotation from a work that is still in copyright to a single sentence. The Snape entry
# below is a deliberate exception, ruled by the owner and recorded there; every future in-copyright entry
# still starts from the single sentence.
# The quotation marks belong to the text here, not to a CSS rule, so that a reader who copies a line gets the
# marks with it. The year is printed once, in the source line after the work's title: the page has no date
# gutter (controller decision C5 item 10, 2026-09-25, after external review 3 §24 -- the same "1887" beside
# three of the four lines asked the reader to read a chronology the page is not using). A date that needs a
# parenthetical (Pope's 1733–34) has room in the source line to say it properly.
# ORDER: the owner's -- the Snape line first (owner ruling, 2026-09-21; record kept privately). The list used to
# run oldest first, so that the years in the gutter only went forward; that rule is dropped, because he cares
# which line a reader meets first -- and with the years off the gutter, nothing on the page reads as a
# chronology any more. A commonplace book is a person's own order, not a chronology. Keep his order when you
# add to it: say where a new line goes, do not sort.
# The intro is the one understated sentence external review 3 §24 proposed, taken as written under the
# owner's delegation of this page (ruling 18, decision C2; record kept privately): it gives the selection a
# reason without explaining each line, and answers the page's one question -- what does he choose to keep
# thinking about. It replaces the 2026-09-25 intro that said what a commonplace book is (CS-18/DI-05); the
# heading and the page description still name the genre for a reader who has not met the word. The sentence
# is not in his own words: Q-N item 18 / Q-M item 1 still offer him to replace it with one that is.
# The no-break ties (U+00A0) hold a section numeral to its noun in every chapter field below (Part I,
# Chapter II, Chapter 24, Epistle II) and hold Pope's title together; the template ties each work's year to
# its title (Phoenix (2003), Scarlet (1887)) and the Watson line's dash to the word before it: with the
# permalink at the end, the Watson source ran to three lines on a laptop and opened its second on a lone "I",
# which reads as the pronoun, and the Snape line opened one on "(2003)," on a 320px phone (review of WP-S4,
# 2026-09-25). The Doyle title is tied as "A Study" and "in Scarlet" (U+00A0 after "A" and before "Scarlet"),
# and "Mr." to "Sherlock" in the Watson chapter: once the title was a link, a lone underlined "A" ended a
# line at every common iPhone width in WebKit (360-430) and at 340-380 and 420-470 in Chromium, and
# "Study in / Scarlet" at 400-410 and 470-490; "“Mr. / Sherlock Holmes”" broke the same way at 360-414. The
# whole title tied split "(1887)," mid-word at 200% text on a 340-400px phone, so the one break left is
# between "Study" and "in" (review of WP-S19, 2026-09-26). The Snape title's "…the Order of the / Phoenix"
# on a laptop is accepted as a bibliographic wrap: every tie that would move it splits "(2003)," or "Phoenix"
# mid-word at 200% text on a 320px phone (measured). tests/test_browser.py measures the line starts and ends.
quotes_intro: 'I keep these lines because they return to a question I find difficult to leave alone: what can we infer about a mind from what it does?'
quotes:
# The owner was shown that this novel is in copyright and that the single sentence “The mind is not a book…”
# was the safer extract, and chose the full four-sentence passage anyway on 2026-09-21. It is printed here at
# his instruction: do not silently shorten it back. The verifier’s two corrections are applied — “mind
# reading” as two words, and the last sentence carried through to “most minds are” instead of breaking off
# after “Potter—”.
- text: “Only Muggles talk of ‘mind reading.’ The mind is not a book, to be opened at will and examined at leisure. Thoughts are not etched on the inside of skulls, to be perused by any invader. The mind is a complex and many-layered thing, Potter—or at least, most minds are.”
  speaker: Severus Snape
  author: J.K. Rowling
  work: Harry Potter and the Order of the Phoenix
  year: '2003'
  chapter: Chapter 24, “Occlumency”
  slug: snape-mind-not-a-book
  status: corrected
  evidence: >-
    The novel is in copyright and no full text is reachable, so wording was triangulated across scanned books
    via Open Library full-text search (openlibrary.org/search/inside). Six-plus independent works reproduce the
    passage identically, including Trevarthen, The Seeker’s Guide to Harry Potter (“Snape responds, “Only
    Muggles talk of ‘mind reading.’ The mind is not a book, to be opened at will and examined at leisure.
    Thoughts are not etched on the inside of skulls, to be perused by any invader. The mind is a complex and
    many-layered thing, Potter—or at least, most minds are.”), Baggett & Klein, Harry Potter and Philosophy,
    Iacoboni, Mirroring People, and Lorrie Kim, Snape: A Definitive Reading. Speaker independently confirmed as
    Severus Snape by Wikiquote’s Order of the Phoenix page. Chapter confirmed by two reference works citing it
    directly: Waters, Ultimate Unofficial Guide to the Mysteries of Harry Potter (“that pun in the title of
    Chapter 24 — ‘Occlumency’”) and Boughey, Unauthorized Harry Potter and the Art of Spying (“Chapter 24,
    ‘Occlumency,’ understandably focuses on what Muggles…”). Recommended extract was one sentence — the
    shortest faithful unit that carries the thought — because the work is in copyright; the owner read that
    recommendation and ruled on 2026-09-21 for the full four-sentence passage, which is what is printed.
    Two corrections were applied to his wording: “mind reading” is two words in every source consulted, and
    the closing sentence runs on to “or at least, most minds are” rather than breaking off after “Potter—”.
  copyright: in-copyright-extended-extract-owner-ruled
  # The note used to end “after Harry calls Legilimency “mind reading”” — which the first sentence of the
  # longer extract now says itself, two lines above it. It points back at those words instead of repeating them.
  note: Snape’s retort in Harry’s first Occlumency lesson, after Harry gives Legilimency that name.
- text: “I consider that a man’s brain originally is like a little empty attic, and you have to stock it with such furniture as you choose.”
  speaker: Sherlock Holmes
  author: Arthur Conan Doyle
  work: A Study in Scarlet
  year: '1887'
  chapter: Part I, Chapter II, “The Science of Deduction”
  source_url: https://www.gutenberg.org/ebooks/244
  slug: holmes-brain-attic
  status: verified
  evidence: >-
    Project Gutenberg ebook #244 (https://www.gutenberg.org/cache/epub/244/pg244.txt), downloaded in full and
    grepped. Passage at lines 493-495, which falls between the CHAPTER II heading (line 407, title “THE SCIENCE
    OF DEDUCTION”) and CHAPTER III (line 787), inside PART I (line 69) — so Part I, Chapter II is correct.
    Extracted character-for-character; note the apostrophe in “man’s” is a curly U+2019. In the novel the
    sentence opens ‘“You see,” he explained, “I consider that a man’s brain…”’, so starting the quote at “I
    consider” is a faithful extract. The owner’s “skilful workman” gloss is also confirmed verbatim at lines
    499-501: “Now the skilful workman is very careful indeed as to what he takes into his brain-attic. He will
    have nothing but the tools which may help him in doing his work…” (British single-l “skilful”).
  copyright: public-domain
  note: Holmes says this immediately after learning the earth goes round the sun and replying, “Now that I do know it I shall do my best to forget it.”
- text: “The proper study of mankind is man.”
  speaker: Dr. John Watson
  author: Arthur Conan Doyle
  work: A Study in Scarlet
  year: '1887'
  chapter: Part I, Chapter I, “Mr. Sherlock Holmes”
  source_url: https://www.gutenberg.org/ebooks/244
  # The line is Pope's, in Watson's mouth: the source line says so after a dash ("— quoting ..."), with the
  # poem's own author, title, span and epistle. The span sits after the poem's title, as the novel's year sits
  # after the novel's: Epistle II alone is 1733, and "(1733–34)" is the whole Essay's (deep review 2026-09-25,
  # AK-16). No source_url here: the ADDENDUM names the three Doyle lines only.
  quoting:
    author: Alexander Pope
    work: An Essay on Man
    year: '1733–34'
    chapter: Epistle II
  slug: watson-proper-study
  status: verified
  evidence: >-
    Project Gutenberg ebook #244, lines 393-395. Exact source text: ‘“Oh! a mystery is it?” I cried, rubbing my
    hands. “This is very piquant. I am much obliged to you for bringing us together. ‘The proper study of
    mankind is man,’ you know.”’ The line sits between CHAPTER I (line 78, title “MR. SHERLOCK HOLMES”) and
    CHAPTER II (line 407), confirming Part I, Chapter I. Speaker is the first-person narrator Watson,
    addressing Stamford. Pope verified independently in two public-domain editions: Gutenberg ebook #2428 (An
    Essay on Man; Moral Essays and Satires), Epistle II lines 1-2 — “Know, then, thyself, presume not God to
    scan; / The proper study of mankind is man.” — and the Wikisource transcription of the 1751 edition
    (en.wikisource.org/wiki/An_Essay_on_Man/Chapter_4), which reads identically apart from period spelling
    (“Plac’d on this isthmus”). Context of the note: Gutenberg #244 lines 261-265 (the introduction and
    'You have been in Afghanistan, I perceive.'), 384-399 (the walk, Watson's question to Stamford, the line
    and Stamford's reply, whose sentence runs on to 'a knotty problem, though.').
  copyright: public-domain
  # The note places the line in the scene rather than explaining Doyle's single quotation marks, which the
  # page does not show (deep review 2026-09-25, CS-19). The "…" in Stamford's reply marks a cut speech tag
  # (", Stamford said, as he bade me good-bye."); ", though" is Doyle's. Quoted, because the colon before the
  # reply would otherwise end the YAML scalar.
  note: 'Watson says it walking away from his first meeting with Holmes, still wondering how Holmes knew, unasked, that he had come from Afghanistan. Stamford, who introduced them, replies: “You must study him, then… You’ll find him a knotty problem, though.”'
- text: “There is a strong family resemblance about misdeeds, and if you have all the details of a thousand at your finger ends, it is odd if you can’t unravel the thousand and first.”
  speaker: Sherlock Holmes
  author: Arthur Conan Doyle
  work: A Study in Scarlet
  year: '1887'
  chapter: Part I, Chapter II, “The Science of Deduction”
  source_url: https://www.gutenberg.org/ebooks/244
  slug: holmes-thousand-and-first
  status: verified
  evidence: >-
    Project Gutenberg ebook #244 (https://www.gutenberg.org/cache/epub/244/pg244.txt), downloaded in full
    (268,777 bytes) and grepped. “family resemblance” occurs exactly once in the book. The sentence spans
    lines 669-671 (byte offset 31491), which falls between the CHAPTER II heading (line 407, offset 17066,
    title “THE SCIENCE OF DEDUCTION”) and CHAPTER III (line 787, offset 36946), and inside PART I (line 69,
    offset 1581; PART II does not begin until offset 121861) — so Part I, Chapter II is correct, and the
    chapter title is confirmed both at the heading itself and in the book’s own CONTENTS list (“CHAPTER II.
    THE SCIENCE OF DEDUCTION.”). Extracted character for character and diffed in Python against the owner’s
    wording: the sole difference is the apostrophe in “can’t”, a curly U+2019 in the source, which is what is
    printed above. Speaker confirmed as Holmes from the surrounding dialogue: Doyle narrates ‘“You would lose
    your money,” Sherlock Holmes remarked calmly. “As for the article, I wrote it myself.”’ and the quoted
    sentence sits inside the same unbroken Holmes speech that begins “Well, I have a trade of my own. I
    suppose I am the only one in the world. I’m a consulting detective…” (line 663). Watson is not speaking
    here. Publication year 1887 is stated on the Gutenberg catalogue page for the work
    (https://www.gutenberg.org/ebooks/244) and matches the two A Study in Scarlet entries above. The
    enclosing curly quotation marks are this file’s house convention, not part of the source sentence.
  copyright: public-domain
  note: From the speech in which Holmes first explains his trade — “I suppose I am the only one in the world. I’m a consulting detective” — moments after admitting to Watson that he himself wrote the magazine article on deduction Watson had just ridiculed.
