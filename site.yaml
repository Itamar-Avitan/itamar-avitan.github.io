# Content and settings for the personal site. Edit this file, then run: python3 build.py
# This repository is public: never add private information here.

# --- settings ---
site_url: https://itamar-avitan.github.io/
alternate_name: Itamar Amram Avitan
affiliation: Ben-Gurion University of the Negev
# Structured data only (the JSON-LD graph in every page's head); nothing here prints on a page. `knows_about`
# holds only terms a page of the site prints -- the field words of About (FACTS ID-FIELD), the research
# intro's term, the identity line's nouns -- because structured data describes the visible page and must not
# add to it (deep review 2026-09-25, MR-06 with EM-14's rule; tests/test_build.py checks each term is visible).
affiliation_url: https://www.bgu.ac.il/
knows_about: [NeuroAI, Computational cognitive neuroscience, Representational alignment, Human vision, Neural network models]
show_cv: true
# Hiding a card does not make it private: nothing unpublished may be stored in this repository at all, hidden
# or not (README, public-only policy). This switch only decides whether a card marked `ongoing: true` is drawn
# (build.py, visible_research).
show_ongoing: false
# Show every item until the list outgrows this; the expander returns by itself when it does. It hid the CCN
# 2025 talk and the PhD start to save 125px, which is the start of the story the rest of the page tells.
news_visible: 8
# The portrait has no alt text on purpose (deep review 2026-09-25, PA-05): it stands beside the name on every
# page, so a description would only make a screen reader say "Itamar Avitan" twice. The templates write
# alt="" and the accessibility statement says so; there is no `alt` key here to fall out of step with them.
portrait: {webp: img/portrait-400.webp, jpg: img/portrait-800.jpg}

# The site is four pages, not one long scroll. The owner asked for that on 2026-09-21: "the phone one column
# is not fun", "might want to go more tabs", "not make it an online cv but more hey this is me website and
# some things about me and updates and stuff". Nothing was dropped in the split -- every section of the old
# page is still here, on the page where a reader would look for it.
#   slug        the address under site_url, and the folder the page is written into. '' is the home page.
#               It also names the template: templates/pages/<slug or "home">.html.j2.
#   nav         the label in the navigation strip, on every page. A page without it is not in the strip.
#   colophon    the label in the small link row at the foot of every page. A page without it is not there.
#               A page needs one of `nav` and `colophon`, or nothing links to it; it may not have both, which
#               would say the same address twice on every page. build.py checks all three of those.
#   heading     the page's <h1>. The home page has none here: its <h1> is the name in the masthead.
#   title       the page's <title> and og:title (optional). Without it: "<heading> — <name>", or the bare
#               name on the home page. The home page sets one so that a search result says who he is, not
#               only his name, which he shares with another Itamar Avitan (deep review 2026-09-25, MR-03).
#   intro       one line of framing under the heading (optional).
#   description the page's meta description (optional); without one, identity_line.
#   og_image, og_image_alt
#               the link-preview picture (1200 by 630, under img/) and its description, when the page has one
#               of its own; every other page shares img/og.png, the name card. The two go together.
# Every page listed here is written into sitemap.xml, strip or colophon alike.
pages:
- slug: ''
  nav: Home
  # Every word of the title and the description is printed on the site already: the field words are in About
  # (FACTS ID-FIELD), the status in the role line, the university in the affiliation. The name leads, exactly
  # as the <h1> prints it (spec 4.5 is a name-form rule: never "Itamar Amram Avitan" here). The description
  # ends on the identity line and follows it when that line changes (owner ruling 17, built by WP-S17).
  title: Itamar Avitan · NeuroAI PhD candidate, Ben-Gurion University
  description: NeuroAI PhD candidate at Ben-Gurion University. I study how to tell which neural network models of human vision are right, not just which ones predict best.
- slug: research/
  nav: Research
  heading: Research
  # The intro frames and hands off; it does not summarise the card 250px below it. The method, the number, its
  # chance baseline and the mechanism are stated once, better, in the paper card -- saying them here too put
  # the same argument on one screen twice in the same order. The second sentence names the field's own term,
  # "representational alignment", which is the noun the talk titles below and a search use (deep review
  # 2026-09-25, CS-08 and PR-06). The closing phrase deliberately echoes the paper title printed just beneath
  # it. Do not reintroduce the bare noun "identifiability" here: its only definition on this site was the
  # sentence that was cut, and the plain verb needs no setup.
  intro: Neural networks can predict human visual judgments, such as which of three images is the odd one out. I ask when that accuracy means a network represents the world as people do — the question of representational alignment. Our results argue for comparisons built to identify the right model, not only the best-fitting one.
  # True of every item on the page: all three talk and poster titles are literally on representational
  # alignment, and the two projects are neurotechnology, not model identification (CS-08).
  description: Itamar Avitan’s paper, talks and posters on representational alignment between neural networks and human vision, and two neurotechnology team projects.
  # This page's link-preview card is the paper's own (img/og-research.png, drawn by tools/make_og.py from the
  # first research card: its badge, short title, authors and the figure the card shows), so a shared
  # /research/ link previews the paper and not the name card (deep review 2026-09-25, DI-09). The alt text
  # follows the image: it names what the picture shows, not what the name card shows.
  og_image: img/og-research.png
  og_image_alt: 'NeurIPS 2025 paper by Itamar Avitan and Tal Golan: When the Best-Fitting Model Isn’t the Right One.'
- slug: teaching/
  nav: Teaching
  heading: Teaching
  intro: Courses I help teach at Ben-Gurion University of the Negev, and the students I have mentored and tutored.
  description: Courses Itamar Avitan helps teach at Ben-Gurion University of the Negev, and the students he has mentored and tutored.
- slug: commonplace/
  nav: Commonplace
  heading: Commonplace
  description: 'A commonplace book: lines about minds, and about how to study one, that Itamar Avitan keeps coming back to.'
# The accessibility statement, added 2026-09-21 at the owner's request.
# A PAGE OF ITS OWN, NOT A SECTION, and NOT IN THE NAVIGATION STRIP. Three decisions, each with its reason:
#   * its own page, because it is about the site rather than about him. Folded into Home it would sit under
#     "About" as a paragraph about focus rings; folded into any other page it would be filed under a heading
#     that does not lead to it. It also has to be reachable from every page, and only a page can be.
#   * not in the strip, because the strip carries the four pages a visitor came for, and a fifth item there
#     would rank a utility page level with the work. It is also the one rule the strip has: four pages.
#   * a small link in the colophon of every page, which is where the web puts this and where a reader who
#     needs it will look for it. build.py writes it into sitemap.xml with the other four.
- slug: accessibility/
  colophon: Accessibility
  heading: Accessibility
  # The four things in the order the page says them: reporting comes second, directly after the aim, which is
  # where the GOV.UK model statement puts it (deep review 2026-09-25, FL-09).
  intro: What this site aims at, how to tell me when it falls short, what was actually done about it, and what is not claimed.
  description: 'The accessibility statement for the personal site of Itamar Avitan: what it aims at, how to report a problem, and what was actually done and checked.'

# The page for an address with nothing at it (GitHub Pages serves /404.html with status 404, at any depth).
# NOT under `pages`: it belongs in neither the strip, the colophon nor the sitemap, and search engines are told
# not to index it. build.py writes it with root-absolute links. The CV sentence is added by the template.
# The intro's second sentence is a claim about the site, and it is true by construction: build.py refuses a
# page that is in neither the strip nor the colophon (see the note over `pages`).
not_found:
  heading: Nothing here
  intro: There is no page at this address. Every page of the site is linked from the strip above or the foot of this one.

# Proper nouns and terms of art that must never break across two lines, wherever they occur in the text.
# A term here must actually occur in the content: a rule that matches nothing is dead configuration, and the
# next reader cannot tell it from a rule that stopped matching by accident. "go-to-market" was removed on
# 2026-09-21 with the phrase itself, when the owner's programme-first ruling took the business-plan detail
# out of the practicum entry (see the note over `projects`).
nobreak:
- Ben-Gurion
- Best-Fitting
# nb() is a case-sensitive replace, so the paper title's "Best-Fitting" leaves the research intro's
