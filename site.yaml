  # row still sits below the peer-reviewed paper's own summary and still weighs less than it, which is right.
  blurb: 'Two weeks at Brown University in Providence, on a programme run jointly with Ben-Gurion University: graduate students from the two universities, admitted by competitive selection, work in small teams, each building a piece of neurotechnology and pitching it. Our five-person team built and pitched EarBetter, an add-on that works with any headphones, reads biosignals and filters out the sounds that set a person’s anxiety off.'
