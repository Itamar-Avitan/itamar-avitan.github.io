  note: From the speech in which Holmes first explains his trade — “I suppose I am the only one in the world. I’m a consulting detective” — moments after admitting to Watson that he himself wrote the magazine article on deduction Watson had just ridiculed.
# Teaching, in two sections since 2026-09-21. It was one undifferentiated list of four sentences: no headings,
# no ticks of its own, the only page on the site with no internal structure -- and it ranked "mentoring two
# undergraduate research students" level with a three-year teaching assistantship. Worse, this page is meant
# to be the authority on his teaching and it did not carry the academic writing course that "now" above
# announces for 2026/27. The institution is not repeated on every row any more: the page's own intro says it
# once, and the one row that belongs to another unit names it (Dean of Students Office).
# ORDER: newest first, like every list on the site (deep review 2026-09-25, FL-08). Courses was the one list
# on the site that ran the other way, so the gutter changed direction between it and Students; it now reads
# one direction down the whole page, and the CV prints the courses in the same order.
#   title  the course, or the students -- or, for the one course whose registrar title is not printed yet, a
#          description of it (see the note over that row).
#   kind   what he is in it: a tag in the gutter, under the dates -- the same label a talk carries, set as a
#          small uppercase mono label rather than an outlined box (deep review 2026-09-25, DS-03: six
#          identical boxes were the loudest thing in this page's gutter).
#          A role noun in every row (Teaching assistant, Teaching team, Mentor, Tutor): a gerund there read as
#          an activity, and "Joining" read as attending (deep review 2026-09-25, CS-17).
#   when   the years. Lifted into the gutter and ticked on the margin rule like every other date on the site.
#   what   Under Courses: DRAFT. One sentence on what the course is about, written from the course's own name
#          and from what this site already says; the rows carry no claim about his duties beyond the role in
#          "kind", because nothing here records them. What he actually does inside each course is his to say
#          (Q-G) -- when he says it, replace these sentences with his words rather than adding to them.
#          Under Students: not a draft. The two sentences are the register's own words (FACTS TEACH-MENT-DESC
#          and TEACH-TUTOR), which cv.pdf already prints; this page was the one place that said less.
teaching:
  courses:
  # DESCRIBED, NOT TITLED, until the title is printed. The course's own title is recorded nowhere on the site
  # or in the register (FACTS TEACH-WRITING, "title unconfirmed"), so the row says what the course is rather
  # than setting a stand-in in the title slot beside three real titles, and it carries no sentence: a line
  # about the content of a course nobody has named would be the one claim on the site with no source (deep
  # review 2026-09-25, AK-03 and CS-17). Owner ruling 13 of 2026-09-25 has since given the title ("Academic
  # Writing") and the role (teaching assistant, from 2026/27); printing them is WP-S12, with the CV line in
  # WP-C13, and this row waits for that package rather than pre-empting it.
  # Teaching team: the course is under his teaching appointment (spec §8, source E), which is all that is
  # recorded here, and the tag claims no more than the Now line's "helping teach"; the exact role is his to
  # give, and the ruling above gives it -- WP-S12 prints it.
  - title: An academic writing course
    kind: Teaching team
    when: from 2026/27
  - title: Introduction to Cognition and Computation
    kind: Teaching assistant
    when: 2023/24, 2024/25 and 2025/26
    what: 'An introduction to treating a mind as something that computes: the questions cognitive science asks, and the models built to answer them.'
  - title: Deep Learning for Neuroscience and Cognition
    kind: Teaching assistant
    when: spring 2026
    what: 'Deep networks as models of brains and behavior: how one is built and trained, and what it takes to read it as a claim about a mind.'
  # Quote the year. `when` is lifted into the gutter and split on the en dash by the template, so a bare 2024
  # is read by YAML as an integer and the build stops on it. This is the one row whose date is a bare year;
  # which semester of 2024 it was is his to say (Q-G).
  - title: Computational Approaches to Neuroimaging
    kind: Teaching assistant
    when: '2024'
    what: 'Turning brain images into numbers: the computational methods that take imaging data and make a measurement out of it.'
  students:
  # One topic per student, in the register's words (TEACH-MENT-DESC; the students are not named, MENT-NAMES),
  # spelled "modeling" because the site spells US (RN-04).
  - title: Two undergraduate research students
    kind: Mentor
    when: 2025–2026
    what: 'In the lab: one on model–brain alignment, one on statistical modeling of neural spiking data.'
  # The post is the title and the subjects are the sentence, so the row reads as a post and not as a course
  # with an odd name. The subjects are TEACH-TUTOR's, from the advisor-edited CV the register sources: the
  # site once printed a weaker list that dropped statistics and said "algebra" where the confirmed subject is
  # linear algebra.
  - title: Academic tutoring, Dean of Students Office
    kind: Tutor
    when: 2021–2023
    what: Calculus, linear algebra and statistics.

# The accessibility statement. Every line below is a claim about this site, so the rule for editing it is
# stricter than for anything else in this file: it may only say what is true and what is checked.
#   * Each bullet under `done` names something a test actually asserts (tests/test_build.py,
#     tests/test_browser.py) or a plain fact of the build. If you change the site so that one of them stops
#     being true, change the bullet in the same commit -- a stale accessibility statement is worse than none.
#   * `aim` says what the site AIMS at. Do not turn it into a conformance claim: nothing here has been
#     audited, and an untested claim of conformance is the one thing such a page must never make.
#   * `limits` is not an apology, it is the other half of the statement. Keep it.
#   * NO LEGAL CLAIM OF ANY KIND. No law is cited here and none should be: this is a personal site, the
#     question of which rules bind it is not one this page can answer, and saying otherwise would be a claim
#     about his obligations that nobody has checked.
#   * The address is NOT repeated here. `report` points at the colophon, which carries it on every page,
#     written as "name [at] host" and turned into a link in the browser. Two reasons, both load-bearing: the
#     build refuses a plain address anywhere in this file, and exactly one element per page may carry
#     id="email" -- that is the hook the script in base.html.j2 uses.
accessibility:
  # Reworded in the deep review of 2026-09-25 (CS-10, CS-11, MR-12, PA-05) so that every sentence is true as
  # written: the host sees every visit (so "tells nobody else" became "no one but the host, GitHub Pages");
  # the tests are run by hand before a change is published, not "automatically before the site is built"
  # (README: build, then pytest, no CI); the portrait carries alt="" on purpose, so the picture bullet names
  # only what a test asserts -- the figure's description and the three hidden link marks (test_browser.py,
  # test_structure_and_alt_text); and the email sentence no longer gives "harder to harvest" as its reason,
  # because cv.pdf, linked from every page, prints both addresses as plain links. Every em dash in this
  # block follows a no-break space (U+00A0), so none of them opens a line on a phone (review of WP-S4).
  aim: 'This site aims at WCAG 2.1 Level AA — the middle of the three levels of the Web Content Accessibility Guidelines — and that is the standard I hold it to. It is not a certificate: nobody but me has audited this site, and the list below is what was actually done, not a claim that the whole of AA has been met.'
  done_intro: 'What that has meant in practice. Each of these is checked by an automated test that I run before I publish a change, so the list stays true:'
  done:
  - 'Nothing loads from anyone else. The fonts are served from this site, and no page asks any other host for anything — no analytics, no trackers, no embedded players, no hosted fonts — so the pages work on a slow or filtered connection, and reading them tells no one but the host, GitHub Pages, that you were here.'
  - 'Contrast is measured, not judged by eye. Every piece of text painted on every page is sampled in a real browser and checked against the WCAG contrast formula — 4.5 to 1 for ordinary text, 3 to 1 for large text — in both themes, whether the theme comes from your system setting or from the theme button.'
  - 'Everything you can use, you can reach from a keyboard, and you can see where you are: every link and the theme button draws the same two-pixel ring when it takes focus.'
  - 'The controls are big enough to hit: every link in the navigation strip, in the row of profiles and in the footer is a target at least 24 by 24 pixels, on every screen down to 320 pixels wide. A link set inside a sentence is left at the size of the words around it.'
  - 'Nothing moves on its own. The only motion is a short color fade and smooth scrolling, and both are switched off for a visitor whose system asks for reduced motion.'
  - 'The markup says what things are: one first-level heading per page, headings that never skip a level, lists marked up as lists, the navigation in a named landmark with the current page marked, and a language set on the document.'
  - 'Every picture that carries information has a text alternative: the paper’s figure is described in full for a reader who cannot see it. The portrait beside my name, and the small marks beside Email, GitHub and Bluesky, are hidden from screen readers, because the words beside them already say it.'
  - 'The site works with JavaScript switched off: the pages are plain HTML joined by ordinary links. Two things need it, and both fail quietly — the theme button, which stays hidden until the script has run rather than sitting there doing nothing, and my email address, which is written as text and made into a link in your browser.'
  - 'Body text is set at 16 pixels or larger, the layout reflows into one column on a phone, and no page scrolls sideways at any width down to 320 pixels.'
  limits_intro: 'The gaps I know about, so that the list above is not read for more than it says:'
  limits:
  - This site has not been audited by anyone else, and it has not been tested with a screen reader, with voice control or with a magnifier. The checks above are automated ones and my own reading, and neither can tell you how a page actually sounds.
  - 'The CV is a PDF, and it is the weakest thing here: it is built so that its text comes out in order and every address in it is real text, but it is not a tagged PDF.'
  - This is a personal site. I write it and keep it working, in the time I have, so a fix may not be quick.
  # "at the foot of this page" first: this section now stands second on the page, under the aim, so the
  # colophon that carries the address is no longer in view when the sentence is read (FL-09, CS-11).
  report: 'If something here is hard to use, or does not work with whatever you use to read the web, please tell me — that is the fastest way for it to get fixed. My address is at the foot of this page, and at the top of the home page. What helps most: which page you were on, what you were using, and what happened.'

footer:
  updated: September 2026
  # The caption beside the colophon's mark, which had stood on every page unexplained: two of a kind and the
  # odd one out is the task of the paper (deep review 2026-09-25, DI-01). "our", as every line on the site
  # that names the paper says it; every word is already on the site (the research intro's "odd one out", the
  # news items' "our NeurIPS 2025 paper"). The venue and its year are tied with a literal no-break space, as
  # "Negev, Israel" is in `role`: the line is printed raw by templates/base.html.j2, not through nb(), so the
  # `nobreak` list cannot reach it, and untied the caption broke "NeurIPS / 2025" at 760-1023px (an iPad held
  # upright) and on phones (WP-S8 review). Do not tie "odd one out" as well: at 320px that makes the caption
  # four lines instead of three. "NeurIPS" stands unexpanded here, as it does in a venue badge: the caption is
  # a label beside a mark, not running text, and the rule that each page expands the acronym at its first
  # use is a rule for the text (on the research page the card's badge precedes the venue line's expansion in
  # the same way). The mark itself is drawn in templates/base.html.j2; the favicon and the arrangement of the
  # three shapes are the owner's (Q-L) and this line does not touch them.
  mark_note: 'Two alike and one odd one out: the task behind our NeurIPS 2025 paper.'
