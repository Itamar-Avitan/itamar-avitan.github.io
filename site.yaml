# drops whole to a second line, which reads as a clean break. At 320px each item already has its own line
# and this one takes two, "Ben-Gurion University of the" / "Negev, Israel": the space before "Israel" is
# U+00A0 so the country never stands alone on the last line (it did at 320–340px and at 390px with 125%
# text). A `nobreak` entry would do the same in Chromium and Firefox, but WebKit lets a nowrap span that
# holds a space overflow by up to a space width, and the item then ran 3.8px past the column at 320px on
# the interior pages and 2.7px at 340px on home; the no-break space wraps correctly in all three engines.
# `affiliation:` at the top stays without the country: it feeds the JSON-LD.
- label: Ben-Gurion University of the Negev, Israel
# The site's first sentence, the owner's own choice among the wordings put to him (owner ruling 17,
# 2026-09-25; record kept privately -- the review's rulings file): two sentences, the object of study and
# then the question, in place of the one-line "right, not just which ones predict best" thesis, which now
# lives in the paper's own title and on the research page. It is printed once, as the masthead lede -- the
# template sets the first sentence a step larger than the second -- and reused as it stands by the meta
# description, the og text, the JSON-LD description and the name card (tools/make_og.py: rerun it when this
# changes). Typographic apostrophe and em dash, as the ruling asks; the space before the dash is a no-break
# space (U+00A0), the site's convention for its own dashes (About, the accessibility statement): untied, the
# lede opened a line on "— and when it does not." at 200% text at twelve widths (460-490, 890-920 and
# 1060-1090px; Chromium, measured 2026-09-26) and at none at 100%. The description above carries the same tie, so the two stay one string.
identity_line: I study human vision with computational models. I’m interested in when a model’s success at predicting behavior tells us something about the representation behind it — and when it does not.

# DRAFT, awaiting the owner's own words. Written on 2026-09-21 because the owner asked for an About section in
# his own voice and a Now block (owner ruling, 2026-09-21; record kept privately). Every clause below is drawn
# from facts already on this site, on the CVs (FACTS.md in the cv repository) or ruled by him. Nothing about
# his life outside that is invented, and nothing should be added here that he has not said.
#
# Two paragraphs since 2026-09-26 (WP-S17), on astra's wireframe for the front door (controller decision C1
# under owner ruling 18; record kept privately): the home page answers "who is he and what question animates
# his work", and About is the person, not the paper. The first paragraph is who he is and how he got here --
# the field words every CV prints (FACTS ID-FIELD, "NeuroAI and computational cognitive neuroscience"), the
# lab and the advisor, the two undergraduate fields (FACTS EDU-UG-DEGREES; the degree line's "(computational
# track)" is left to the CV: two words the word budget could not carry), and the three things the work combines, which are the paper's
# (human judgments, models, model-recovery simulations) -- and closes on ONE sentence about the broader
# question, at the level a researcher states on a homepage: how to compare models with minds so that competing
# ideas can be told apart, which experiments separate them, and how people differ in how they see. That
# sentence names interests and not studies (owner request, 2026-09-25, that his broader interests be stated
# without revealing future work; the same two interests close the academic CVs' Research-interests line,
# FACTS INT-BROADER); it carries no verb of future work, no dataset, no method beyond "model recovery", and
# nothing about the NEAT 2026 work (owner ruling 16). Do not grow it into a programme. It opens "The larger
# question is", not "Behind it is a broader question": the lede a screen above already ends on "the
# representation behind it", and the paragraph had three "it"s with three referents (review of WP-S17,
# 2026-09-26). The second paragraph is
# the rest of the person: the teaching by subject (the titles and the years are the teaching page's and the
# Now line's -- said there, not here as well), the mentoring in the past tense (MENT-YEARS is 2025-2026), the
# two things built with other people, and the commonplace. "And I collect lines about the mind." stays as
# written (external review 3 kept it by name).
#
# Gone since 2026-09-26: the paragraph that argued the paper (the mapping, the twenty networks, the 80%) --
# that argument is the featured Research block directly under About, drawn from the paper card, and the
# CV-shaped sentence on the PhD's start and expected end (the CV chip in the strip carries the record; do not
# put "degrees are in the CV" back either).
#
# The practicum clause -- "a headphone add-on designed to filter the sounds that set anxiety off" -- names the
# add-on by what it was designed to do, never as a working filter (owner ruling 15, 2026-09-25; the note
# over `projects` has the rule), and says nothing about who did what: the ruled role clause belongs to the
# project row alone. The ALS expansion is this page's first use of the acronym. Do not add to this clause.
#
# Ties: the space before the em dash in the first paragraph is a no-break space (U+00A0), so the dash never
# opens a line. Word count 79 + 69 = 148 of the 80-150 the test allows (str.split() counts the dash and the
# colon-less "with"); nothing may be added without a cut, and if the count ever trips, cut "on courses" first.
# The three teaching subjects each take their own "in" ("in computation and cognition, in neuroimaging and in
# deep learning"): without it the list read as two pairs (reviews of WP-X1 and WP-S17).
about:
- 'I work in NeuroAI and computational cognitive neuroscience, with Dr. Tal Golan in the Brains and Machines Lab at Ben-Gurion University of the Negev. I came to it from psychology and cognitive and brain sciences, and my work combines human behavioral data, machine learning and model-recovery simulations. The larger question is how to compare models with minds so that competing ideas can be told apart — which experiments separate them, and how people differ in the way they see.'
- 'I have been a teaching assistant on courses in computation and cognition, in neuroimaging and in deep learning, and have mentored two undergraduates in the lab. I like building things with other people: a brain–computer interface that let a person with amyotrophic lateral sclerosis (ALS) answer yes or no, and a headphone add-on designed to filter the sounds that set anxiety off. And I collect lines about the mind.'
# DRAFT, as above. Short enough to keep true: rewrite it whenever it stops being what you are doing.
# One dated line since 2026-09-26 (WP-S17; astra's wireframe, controller decision C1 under owner ruling 18):
# the current activity, not a list, and not the paper's question again -- that lives in the featured Research
