# programme's own page, as the talk rows link a venue's name to the venue's page: link text and destination
# name the same thing. The team's repository -- its README opens "A 2026 Brown University-Ben-Gurion
# University Embodied Brain Technology Practicum project", and it is the same address the CVs print under
# the same entry head, as "Code:" -- is the row's "Code" link, the CVs' label (deep review 2026-09-25, AK-17).
# The CV entry is laid out the same way: practicum in the head, EarBetter in the bullet. BCI4ALS stays
# unlinked (ruling): its README prints teammates' personal email addresses.
- title: Embodied Brain Technology Practicum
  period: 24 Jul–6 Aug 2026
