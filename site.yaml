# joined by hyphens -- which becomes the id of its row and the address of the small "§" link at the end of
# its attribution, so that one line can be shared (commonplace/#holmes-brain-attic lands on that entry, with
# the page's accent ring around it). A slug is NEVER CHANGED once published: a link someone kept would stop
# landing. build.py refuses a quotation without one, a malformed one, and two the same. The link is always
# painted, never only on hover: a keyboard or a finger cannot hover.
