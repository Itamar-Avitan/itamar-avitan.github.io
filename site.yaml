- title: EarBetter
  period: 24 Jul–6 Aug 2026
  blurb: Our five-person team’s prototype from the 2026 Brown University–Ben-Gurion University Embodied Brain Technology Practicum at Brown University. It explores whether physiological signals can drive selective audio attenuation. I worked on control software and system integration. The prototype was completed and pitched; parts of it remain experimental, and it has not been clinically evaluated.
