# The front door has to hand a visitor on. Added 2026-09-21: the home page named the commonplace, the teaching
# and the NeurIPS paper without a way to reach any of them, so the only route into the site was the navigation
# strip, and at laptop width the whole left gutter of the home page sat empty. These three rows use the grid
# the rest of the site is built on -- a label in the gutter, the line in the text column -- and each one says
# something real about where it goes rather than "read more".
#   page   the gutter label. It is a tag, not a date: this list is the one place on the site where the
#          gutter carries an address instead of a point in time, so it takes a tag (a label that is never
#          clickable) and no tick, exactly as the "kind" tag under a talk's date does. The margin rule stays a
#          time axis; nothing false is put on it. The tag is set as a small uppercase mono label, not an
#          outlined box: boxed, a page name read as a button that does nothing (deep review 2026-09-25,
#          DS-03); the box now belongs to the paper card's venue badges alone.
#   label  the link itself, and it must be a real thing on that page -- the paper's short title, the course,
#          the line -- never "read more" or the page's own name a second time.
#   text   what else is there, in one clause. The template sets the em dash between the two, tied to the
#          label by a no-break space so that it never opens a line.
# The commonplace row deliberately does not quote the Snape passage again: the novel is in copyright, the
# house rule keeps such an extract to the page that argued for it, and the full passage is printed there at
# the owner's ruling. Naming the speaker and the subject gets a reader there without a second reproduction.
# The Research row is the one row that says more than its label and its line (deep review 2026-09-25, DS-09
# and AS-02). Under its gutter label it carries the paper's first venue badge -- "NeurIPS 2025", the one
# outlined box outside the paper card, drawn from `research[0].badges` as the first badge without " · " (a
# presentation badge such as "CCN 2025 · Talk" is a neutral tag on the card and stays off this row, whatever
# the order of the list) -- and under its line a small mono row with the paper's first button (Paper) and its
# Code link, drawn from `research[0].buttons`. Nothing is written here for it: the badge and the addresses are
# the card's own, so they cannot drift from it. That gives the row three ways out (the page, the paper, the
# code) where the other two keep one; the work is what a visitor came to the front door for, and until this it
# was two clicks away. tests/test_build.py pins the count and the two addresses.
