about:
- My advisor is Dr. Tal Golan, in the Brains and Machines Lab. I came to the lab from cognitive and brain sciences and from psychology; the degrees and the dates are in the CV.
- The measure is the hard part. To say a network sees the way people do, you fit a mapping from its features to human judgments and check how well it predicts — and a mapping flexible enough to fit anything can make the wrong network look like the winner. In our simulations that comparison recovered the model that had generated the data less than 80% of the time.
- 'I teach as well: courses on cognition and computation and on deep learning, an academic writing course from next year, and two undergraduate students whose research I mentor. I like building things with other people — an EEG brain–computer interface that let a person with ALS answer yes or no, and a headphone add-on for the noises that set anxiety off. And I collect lines about the mind.'
